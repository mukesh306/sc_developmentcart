name: SC Backend Production CI/CD

on:
  push:
    branches:
      - dev
      - main

env:
  IMAGE_NAME: sc_backend

jobs:

  build-and-push:

    runs-on: ubuntu-latest

    outputs:
      tag: ${{ steps.tag.outputs.tag }}

    steps:

      - name: Checkout
        uses: actions/checkout@v4


      - name: Set image tag
        id: tag
        run: |
          if [[ "${GITHUB_REF}" == "refs/heads/dev" ]]; then
            echo "tag=dev" >> $GITHUB_OUTPUT
          else
            echo "tag=latest" >> $GITHUB_OUTPUT
          fi


      - name: Docker Hub login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}


      - name: Build Docker image
        run: |
          docker build \
          -t ${{ secrets.DOCKERHUB_USERNAME }}/${IMAGE_NAME}:${{ steps.tag.outputs.tag }} \
          -t ${{ secrets.DOCKERHUB_USERNAME }}/${IMAGE_NAME}:${{ github.sha }} .


      - name: Push Docker image
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/${IMAGE_NAME}:${{ steps.tag.outputs.tag }}
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/${IMAGE_NAME}:${{ github.sha }}



  deploy-dev:

    if: github.ref == 'refs/heads/dev'

    needs: build-and-push

    runs-on: ubuntu-latest

    steps:

      - name: Deploy to DEV
        uses: appleboy/ssh-action@v1.0.3

        with:
          host: ${{ secrets.DEV_HOST }}
          username: ${{ secrets.DEV_USER }}
          key: ${{ secrets.DEV_SSH_KEY }}
          port: ${{ secrets.DEV_PORT }}

          script: |

            cd /var/www/sc_backend

            docker compose pull

            docker compose up -d

            docker image prune -f



  deploy-prod:

    if: github.ref == 'refs/heads/main'

    needs: build-and-push

    runs-on: ubuntu-latest

    steps:

      - name: Deploy to PRODUCTION
        uses: appleboy/ssh-action@v1.0.3

        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}

          script: |

            cd /var/www/sc_backend

            docker compose pull

            docker compose up -d

            docker image prune -f
